<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>DOORS</title>
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="images/logo.svg">
    <style>
        @font-face {
            font-family: 'Tiny5';
            src: url('fonts/Tiny5-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .score-counter {
            position: absolute;
            top: max(20px, env(safe-area-inset-top, 20px));
            right: max(20px, env(safe-area-inset-right, 20px));
            font-family: 'Tiny5', monospace;
            color: #000;
            text-align: right;
            pointer-events: none;
        }

        .high-score, .current-score {
            font-size: clamp(32px, 6vw, 50px);
            line-height: 1.2;
        }

        .hs-number {
            display: inline-block;
        }

        .hs-number.gold {
            color: #FFD700;
            animation: pop 0.2s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }

        .try-again-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease-out, visibility 0.15s ease-out;
            pointer-events: none;
        }

        .try-again-overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .try-again-text {
            color: #000;
            font-family: 'Tiny5', monospace;
            font-size: clamp(32px, 8vw, 50px);
            cursor: pointer;
        }

        .try-again-text:active {
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer">
        <div class="score-counter">
            <div class="high-score">hs: <span class="hs-number" id="hsNumber">0</span></div>
            <div class="current-score"><span id="currentScore">0</span></div>
        </div>

        <div class="try-again-overlay" id="tryAgainOverlay">
            <div class="try-again-text" id="tryAgainBtn">try again</div>
        </div>
    </div>

    <script>
    'use strict';

    // ============================================================
    // GAME ENGINE - Professional HTML5 Game Architecture
    // ============================================================

    const Game = (function() {
        // -------------------- CONFIGURATION --------------------
        const CONFIG = {
            MAX_DISPLAY_SIZE: 1000,
            ANIMATION: {
                FRAME_DURATION: 250,
                LAST_FRAME_FAIL_DURATION: 500
            }
        };

        // -------------------- STATE --------------------
        const state = {
            // Core
            isRunning: false,
            lastTime: 0,

            // Game
            phase: 'idle', // 'idle' | 'animating' | 'gameover'
            score: 0,
            highScore: 0,

            // Animation
            animationData: null,
            animationStartTime: 0,
            currentFrameIndex: -1,

            // Input
            pendingInput: null,

            // Rendering
            needsRender: true,
            currentImageSrc: null
        };

        // -------------------- RESOURCES --------------------
        const resources = {
            images: new Map(),
            audioBuffers: new Map(),
            audioContext: null,
            audioUnlocked: false
        };

        const IMAGES = {
            static: 'images/static_image.svg',
            left: {
                positive: ['images/left_1.svg', 'images/left_2.svg', 'images/left_3.svg'],
                negative: ['images/left_1.svg', 'images/left_2.svg', 'images/left_3_0.svg']
            },
            right: {
                positive: ['images/right_1.svg', 'images/right_2.svg', 'images/right_3.svg'],
                negative: ['images/right_1.svg', 'images/right_2.svg', 'images/right_3_0.svg']
            }
        };

        const SOUNDS = ['click', 'success', 'fail'];

        // -------------------- CANVAS --------------------
        let canvas, ctx;
        let canvasWidth = 0, canvasHeight = 0;
        let dpr = 1;

        // Offscreen buffer for double buffering
        let offscreen, offCtx;

        // Pre-rendered image bitmaps for instant drawing
        const bitmapCache = new Map();

        // Image draw cache
        const drawCache = { src: null, x: 0, y: 0, w: 0, h: 0 };

        // -------------------- DOM --------------------
        let dom = {};

        // -------------------- AUDIO SYSTEM --------------------
        function initAudio() {
            if (resources.audioContext) return;

            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                resources.audioContext = new AC({ latencyHint: 'interactive' });
            } catch (e) {
                console.warn('Web Audio not supported');
            }
        }

        async function loadSound(name) {
            if (!resources.audioContext) return;

            try {
                const response = await fetch(`sounds/${name}.wav`);
                const buffer = await response.arrayBuffer();
                const audioBuffer = await resources.audioContext.decodeAudioData(buffer);
                resources.audioBuffers.set(name, audioBuffer);
            } catch (e) {
                console.warn(`Failed to load sound: ${name}`, e);
            }
        }

        async function loadAllSounds() {
            initAudio();
            if (!resources.audioContext) return;
            await Promise.all(SOUNDS.map(loadSound));
        }

        function unlockAudio() {
            if (resources.audioUnlocked || !resources.audioContext) return;

            const ctx = resources.audioContext;

            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            // Play silent buffer to unlock iOS
            const buffer = ctx.createBuffer(1, 1, 22050);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);

            resources.audioUnlocked = true;
        }

        function playSound(name) {
            const ctx = resources.audioContext;
            const buffer = resources.audioBuffers.get(name);

            if (!ctx || !buffer) return;

            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);
        }

        // -------------------- IMAGE LOADING --------------------
        async function loadImage(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = async () => {
                    resources.images.set(src, img);

                    // Create ImageBitmap for faster rendering (if supported)
                    if (typeof createImageBitmap === 'function') {
                        try {
                            const bitmap = await createImageBitmap(img);
                            bitmapCache.set(src, bitmap);
                        } catch (e) {
                            // Fallback to regular image
                        }
                    }

                    resolve(img);
                };
                img.onerror = () => {
                    console.error('Failed to load:', src);
                    resolve(null);
                };
                img.src = src;
            });
        }

        async function loadAllImages() {
            const allSrcs = [
                IMAGES.static,
                ...IMAGES.left.positive,
                ...IMAGES.left.negative,
                ...IMAGES.right.positive,
                ...IMAGES.right.negative
            ];

            const unique = [...new Set(allSrcs)];
            await Promise.all(unique.map(loadImage));
        }

        // -------------------- CANVAS SETUP --------------------
        function setupCanvas() {
            canvas = document.getElementById('gameCanvas');

            // Request low-latency context
            ctx = canvas.getContext('2d', {
                alpha: false,
                desynchronized: true
            });

            // Create offscreen buffer
            offscreen = document.createElement('canvas');
            offCtx = offscreen.getContext('2d', { alpha: false });

            resizeCanvas();

            // Debounced resize handler
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(resizeCanvas, 100);
            });
        }

        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);

            const w = canvasWidth * dpr;
            const h = canvasHeight * dpr;

            // Main canvas
            canvas.width = w;
            canvas.height = h;
            canvas.style.width = canvasWidth + 'px';
            canvas.style.height = canvasHeight + 'px';

            // Offscreen buffer
            offscreen.width = w;
            offscreen.height = h;

            // Scale contexts
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            offCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // Disable smoothing
            ctx.imageSmoothingEnabled = false;
            offCtx.imageSmoothingEnabled = false;

            // Invalidate cache and request redraw
            drawCache.src = null;
            state.needsRender = true;
        }

        // -------------------- RENDERING --------------------
        function calculateImageBounds(img) {
            const imgRatio = img.width / img.height;
            const canvasRatio = canvasWidth / canvasHeight;

            let w, h;

            if (imgRatio > canvasRatio) {
                w = canvasWidth;
                h = canvasWidth / imgRatio;
            } else {
                h = canvasHeight;
                w = canvasHeight * imgRatio;
            }

            // Cap size
            const maxSize = CONFIG.MAX_DISPLAY_SIZE;
            if (w > maxSize) {
                w = maxSize;
                h = w / imgRatio;
            }
            if (h > maxSize) {
                h = maxSize;
                w = h * imgRatio;
            }

            return {
                x: (canvasWidth - w) / 2,
                y: (canvasHeight - h) / 2,
                w: w,
                h: h
            };
        }

        function renderFrame() {
            if (!state.needsRender || !state.currentImageSrc) return;

            const src = state.currentImageSrc;

            // Use ImageBitmap if available, otherwise use regular Image
            const drawable = bitmapCache.get(src) || resources.images.get(src);
            if (!drawable) return;

            // Update draw cache if image changed
            if (drawCache.src !== src) {
                const img = resources.images.get(src);
                if (img) {
                    const bounds = calculateImageBounds(img);
                    drawCache.src = src;
                    drawCache.x = bounds.x;
                    drawCache.y = bounds.y;
                    drawCache.w = bounds.w;
                    drawCache.h = bounds.h;
                }
            }

            // Render to offscreen buffer
            offCtx.fillStyle = '#ffffff';
            offCtx.fillRect(0, 0, canvasWidth, canvasHeight);
            offCtx.drawImage(drawable, drawCache.x, drawCache.y, drawCache.w, drawCache.h);

            // Flip: copy to main canvas (double buffering eliminates tearing)
            ctx.drawImage(offscreen, 0, 0);

            state.needsRender = false;
        }

        function setImage(src) {
            if (state.currentImageSrc !== src) {
                state.currentImageSrc = src;
                drawCache.src = null; // Force bounds recalculation
                state.needsRender = true;
            }
        }

        // -------------------- GAME LOGIC --------------------
        function getRandomBool() {
            const arr = new Uint32Array(1);
            crypto.getRandomValues(arr);
            return (arr[0] & 1) === 0;
        }

        function startAnimation(side, isPositive) {
            const frames = isPositive ? IMAGES[side].positive : IMAGES[side].negative;

            state.phase = 'animating';
            state.animationData = {
                frames: frames,
                isNegative: !isPositive,
                soundPlayed: false
            };
            state.animationStartTime = performance.now();
            state.currentFrameIndex = -1;
        }

        function updateAnimation(time) {
            const anim = state.animationData;
            if (!anim) return;

            const elapsed = time - state.animationStartTime;
            const frameCount = anim.frames.length;

            // Calculate current frame based on elapsed time
            let frameIndex = 0;
            let accTime = 0;

            for (let i = 0; i < frameCount; i++) {
                const duration = (i === frameCount - 1 && anim.isNegative)
                    ? CONFIG.ANIMATION.LAST_FRAME_FAIL_DURATION
                    : CONFIG.ANIMATION.FRAME_DURATION;

                if (elapsed < accTime + duration) {
                    frameIndex = i;
                    break;
                }
                accTime += duration;
                if (i === frameCount - 1) {
                    frameIndex = frameCount; // Animation finished
                }
            }

            if (frameIndex < frameCount) {
                // Update frame if changed
                if (frameIndex !== state.currentFrameIndex) {
                    state.currentFrameIndex = frameIndex;
                    setImage(anim.frames[frameIndex]);

                    // Play result sound on last frame
                    if (frameIndex === frameCount - 1 && !anim.soundPlayed) {
                        anim.soundPlayed = true;
                        playSound(anim.isNegative ? 'fail' : 'success');
                    }
                }
            } else {
                // Animation complete
                finishAnimation();
            }
        }

        function finishAnimation() {
            const wasNegative = state.animationData?.isNegative;

            state.animationData = null;
            state.currentFrameIndex = -1;

            if (wasNegative) {
                state.phase = 'gameover';
                showGameOver();
            } else {
                incrementScore();
                state.phase = 'idle';
                setImage(IMAGES.static);
            }
        }

        function incrementScore() {
            state.score++;
            dom.currentScore.textContent = state.score;

            if (state.score > state.highScore) {
                state.highScore = state.score;
                dom.hsNumber.textContent = state.highScore;
                localStorage.setItem('doorsHighScore', String(state.highScore));

                // Trigger animation
                dom.hsNumber.classList.remove('gold');
                void dom.hsNumber.offsetWidth;
                dom.hsNumber.classList.add('gold');
            }
        }

        function resetScore() {
            state.score = 0;
            dom.currentScore.textContent = '0';
        }

        function showGameOver() {
            dom.tryAgainOverlay.classList.add('show');
        }

        function hideGameOver() {
            dom.tryAgainOverlay.classList.remove('show');
        }

        function restartGame() {
            hideGameOver();
            resetScore();
            state.phase = 'idle';
            setImage(IMAGES.static);
        }

        // -------------------- INPUT HANDLING --------------------
        function processInput() {
            const input = state.pendingInput;
            if (!input) return;

            state.pendingInput = null;

            if (input.type === 'tap' && state.phase === 'idle') {
                unlockAudio();
                playSound('click');

                const isPositive = getRandomBool();
                startAnimation(input.side, isPositive);
            } else if (input.type === 'restart' && state.phase === 'gameover') {
                restartGame();
            }
        }

        function handleTap(x) {
            const side = x < canvasWidth / 2 ? 'left' : 'right';
            state.pendingInput = { type: 'tap', side: side };
        }

        function handleRestart() {
            state.pendingInput = { type: 'restart' };
        }

        function setupInput() {
            // Touch input - passive: false to ensure immediate response
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                handleTap(touch.clientX);
            }, { passive: false });

            // Mouse fallback
            canvas.addEventListener('click', (e) => {
                handleTap(e.clientX);
            });

            // Try again button
            dom.tryAgainBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                e.stopPropagation();
                handleRestart();
            }, { passive: false });

            dom.tryAgainBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                handleRestart();
            });

            // Prevent context menu
            document.addEventListener('contextmenu', e => e.preventDefault());

            // Unlock audio on first touch
            document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        }

        // -------------------- GAME LOOP --------------------
        function gameLoop(timestamp) {
            if (!state.isRunning) return;

            // Process input immediately
            processInput();

            // Update animation state
            if (state.phase === 'animating') {
                updateAnimation(timestamp);
            }

            // Render if needed
            renderFrame();

            // Schedule next frame
            requestAnimationFrame(gameLoop);
        }

        function start() {
            if (state.isRunning) return;

            state.isRunning = true;
            state.lastTime = performance.now();

            requestAnimationFrame(gameLoop);
        }

        // -------------------- INITIALIZATION --------------------
        function cacheDom() {
            dom.hsNumber = document.getElementById('hsNumber');
            dom.currentScore = document.getElementById('currentScore');
            dom.tryAgainOverlay = document.getElementById('tryAgainOverlay');
            dom.tryAgainBtn = document.getElementById('tryAgainBtn');
        }

        function loadHighScore() {
            const saved = localStorage.getItem('doorsHighScore');
            if (saved) {
                state.highScore = parseInt(saved, 10) || 0;
                dom.hsNumber.textContent = state.highScore;
            }
        }

        function initTelegram() {
            if (window.Telegram?.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                tg.enableClosingConfirmation();
            }
        }

        async function init() {
            cacheDom();
            setupCanvas();
            setupInput();
            loadHighScore();
            initTelegram();

            // Load resources in parallel
            await Promise.all([
                loadAllImages(),
                loadAllSounds()
            ]);

            console.log('Game ready. Images:', resources.images.size,
                        'Bitmaps:', bitmapCache.size,
                        'Sounds:', resources.audioBuffers.size);

            // Set initial state and start game loop
            setImage(IMAGES.static);
            state.phase = 'idle';
            start();
        }

        // -------------------- PUBLIC API --------------------
        return { init };
    })();

    // Start game when DOM ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', Game.init);
    } else {
        Game.init();
    }
    </script>
</body>
</html>
