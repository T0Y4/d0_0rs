<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>DOORS</title>
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="images/logo.svg">
    <style>
        @font-face {
            font-family: 'Tiny5';
            src: url('fonts/Tiny5-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
        }

        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            contain: layout style paint;
        }

        .game-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            contain: layout style paint;
        }

        .left-zone, .right-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 50%;
            z-index: 10;
            cursor: pointer;
        }

        .left-zone {
            left: 0;
        }

        .right-zone {
            right: 0;
        }

        .game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            -webkit-user-drag: none;
            z-index: 5;
        }

        .try-again-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
            contain: layout style paint;
        }

        .try-again-overlay.show {
            display: flex;
        }

        .try-again-text {
            color: #000;
            font-family: 'Tiny5', monospace;
            font-size: clamp(32px, 8vw, 50px);
            font-weight: normal;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .try-again-text:active {
            opacity: 0.5;
        }

        .score-counter {
            position: absolute;
            top: max(20px, env(safe-area-inset-top, 20px));
            right: max(20px, env(safe-area-inset-right, 20px));
            z-index: 15;
            font-family: 'Tiny5', monospace;
            color: #000;
            text-align: right;
            contain: layout style;
        }

        .high-score, .current-score {
            font-size: clamp(32px, 6vw, 50px);
        }

        .hs-number {
            display: inline-block;
            transition: transform 0.15s ease-out, color 0.15s ease-out;
        }

        .hs-number.gold {
            color: #FFD700;
        }

        .hs-number.pop {
            transform: scale(1.35);
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: white;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-area">
            <div class="left-zone" id="leftZone"></div>
            <div class="right-zone" id="rightZone"></div>
            <canvas class="game-canvas" id="gameCanvas"></canvas>
            <div class="try-again-overlay" id="tryAgainOverlay">
                <div class="try-again-text" id="tryAgainText">try again</div>
            </div>
            <div class="score-counter" id="scoreCounter">
                <div class="high-score">
                    <span class="score-label">hs:</span> <span class="hs-number" id="hsNumber">0</span>
                </div>
                <div class="current-score">
                    <span class="score-value" id="currentScoreValue">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ==================== AUDIO SYSTEM ====================
        // Web Audio API for minimal latency
        let audioContext = null;
        const audioBuffers = new Map();
        let audioUnlocked = false;

        const SOUNDS = {
            fail: 'sounds/fail.wav',
            click: 'sounds/click.wav',
            success: 'sounds/success.wav'
        };

        function initAudioContext() {
            if (audioContext) return audioContext;

            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContextClass({ latencyHint: 'interactive' });

                // iOS Safari requires resume after user gesture
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            } catch (e) {
                console.warn('Web Audio API not supported:', e);
            }

            return audioContext;
        }

        async function loadAudioBuffer(url) {
            if (!audioContext) return null;

            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                return audioBuffer;
            } catch (e) {
                console.warn('Failed to load audio:', url, e);
                return null;
            }
        }

        async function preloadAllSounds() {
            initAudioContext();
            if (!audioContext) return;

            const loadPromises = Object.entries(SOUNDS).map(async ([key, url]) => {
                const buffer = await loadAudioBuffer(url);
                if (buffer) {
                    audioBuffers.set(key, buffer);
                }
            });

            await Promise.all(loadPromises);
            console.log('Audio buffers loaded:', audioBuffers.size);
        }

        function playSound(soundKey) {
            if (!audioContext || !audioBuffers.has(soundKey)) return;

            try {
                // Resume context if suspended (iOS requirement)
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                const source = audioContext.createBufferSource();
                source.buffer = audioBuffers.get(soundKey);
                source.connect(audioContext.destination);
                source.start(0);
            } catch (e) {
                console.warn('Sound play error:', e);
            }
        }

        // Unlock audio on first user interaction (required for iOS)
        function unlockAudio() {
            if (audioUnlocked) return;

            initAudioContext();
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }

            // Play silent buffer to unlock
            if (audioContext) {
                const buffer = audioContext.createBuffer(1, 1, 22050);
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(0);
            }

            audioUnlocked = true;
        }

        // ==================== IMAGE SYSTEM ====================
        const IMAGES = {
            static: 'images/static_image.svg',
            left: {
                positive: ['images/left_1.svg', 'images/left_2.svg', 'images/left_3.svg'],
                negative: ['images/left_1.svg', 'images/left_2.svg', 'images/left_3_0.svg']
            },
            right: {
                positive: ['images/right_1.svg', 'images/right_2.svg', 'images/right_3.svg'],
                negative: ['images/right_1.svg', 'images/right_2.svg', 'images/right_3_0.svg']
            }
        };

        const imageCache = new Map();
        const bitmapCache = new Map();
        let imagesLoadedCount = 0;
        let totalUniqueImages = 0;

        async function preloadImages() {
            const allImages = [
                IMAGES.static,
                ...IMAGES.left.positive,
                ...IMAGES.left.negative,
                ...IMAGES.right.positive,
                ...IMAGES.right.negative
            ];

            const uniqueImages = [...new Set(allImages)];
            totalUniqueImages = uniqueImages.length;

            await Promise.all(uniqueImages.map(src => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = async () => {
                        imageCache.set(src, img);
                        // Create ImageBitmap for faster GPU rendering
                        if (typeof createImageBitmap === 'function') {
                            try {
                                const bitmap = await createImageBitmap(img);
                                bitmapCache.set(src, bitmap);
                            } catch (e) { /* fallback to img */ }
                        }
                        imagesLoadedCount++;
                        resolve(img);
                    };
                    img.onerror = () => {
                        console.error('Failed to load:', src);
                        imagesLoadedCount++;
                        resolve(null);
                    };
                    img.src = src;
                });
            }));
        }

        // ==================== CANVAS SYSTEM ====================
        let canvas, ctx;
        let canvasWidth, canvasHeight;
        let dpr = 1;
        let lastDrawnImage = null;

        // Pre-calculated draw dimensions cache
        let drawCache = {
            width: 0,
            height: 0,
            x: 0,
            y: 0,
            imgSrc: null
        };

        const MAX_DISPLAY_SIZE = 1000;

        function initCanvas() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d', {
                alpha: false,  // Opaque canvas - better performance
                desynchronized: true  // Reduce latency on supported browsers
            });

            // Disable image smoothing once
            ctx.imageSmoothingEnabled = false;

            resizeCanvas();
            window.addEventListener('resize', debounce(resizeCanvas, 150));
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvasWidth = container.clientWidth || window.innerWidth;
            canvasHeight = container.clientHeight || window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2); // Cap at 2x for performance

            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.imageSmoothingEnabled = false;

            // Invalidate draw cache
            drawCache.imgSrc = null;

            // Redraw current image if exists
            if (lastDrawnImage) {
                drawImage(lastDrawnImage);
            }
        }

        function calculateDrawDimensions(img) {
            const imgAspect = img.width / img.height;
            const canvasAspect = canvasWidth / canvasHeight;

            let drawWidth, drawHeight;

            if (imgAspect > canvasAspect) {
                drawWidth = canvasWidth;
                drawHeight = canvasWidth / imgAspect;
            } else {
                drawHeight = canvasHeight;
                drawWidth = canvasHeight * imgAspect;
            }

            // Apply max size constraint
            if (drawWidth > MAX_DISPLAY_SIZE) {
                drawWidth = MAX_DISPLAY_SIZE;
                drawHeight = MAX_DISPLAY_SIZE / imgAspect;
            }
            if (drawHeight > MAX_DISPLAY_SIZE) {
                drawHeight = MAX_DISPLAY_SIZE;
                drawWidth = MAX_DISPLAY_SIZE * imgAspect;
            }

            return {
                width: drawWidth,
                height: drawHeight,
                x: (canvasWidth - drawWidth) / 2,
                y: (canvasHeight - drawHeight) / 2
            };
        }

        function drawImage(src) {
            // Use ImageBitmap if available (faster), fallback to Image
            const drawable = bitmapCache.get(src) || imageCache.get(src);
            if (!drawable) return;

            lastDrawnImage = src;

            // Use cached dimensions if same image and canvas size unchanged
            if (drawCache.imgSrc !== src) {
                const img = imageCache.get(src);
                if (!img) return;
                const dims = calculateDrawDimensions(img);
                drawCache.width = dims.width;
                drawCache.height = dims.height;
                drawCache.x = dims.x;
                drawCache.y = dims.y;
                drawCache.imgSrc = src;
            }

            // Clear with white (since alpha: false)
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            ctx.drawImage(drawable, drawCache.x, drawCache.y, drawCache.width, drawCache.height);
        }

        // ==================== GAME STATE ====================
        const gameState = {
            isAnimating: false,
            isNegativeResult: false,
            currentScore: 0,
            highScore: 0,
            animationId: null
        };

        // DOM element references
        let tryAgainOverlay, hsNumber, currentScoreValue;

        // ==================== GAME LOGIC ====================
        function getRandomResult() {
            const array = new Uint32Array(1);
            crypto.getRandomValues(array);
            return (array[0] & 1) === 0; // Faster than modulo
        }

        function showTryAgain() {
            tryAgainOverlay.classList.add('show');
        }

        function hideTryAgain() {
            tryAgainOverlay.classList.remove('show');
        }

        function updateScoreDisplay() {
            currentScoreValue.textContent = gameState.currentScore;
            hsNumber.textContent = gameState.highScore;
        }

        function celebrateHighScore() {
            hsNumber.classList.add('gold', 'pop');
            setTimeout(() => {
                hsNumber.classList.remove('gold', 'pop');
            }, 200);
        }

        function increaseScore() {
            gameState.currentScore++;
            currentScoreValue.textContent = gameState.currentScore;

            if (gameState.currentScore > gameState.highScore) {
                gameState.highScore = gameState.currentScore;
                hsNumber.textContent = gameState.highScore;
                localStorage.setItem('doorsHighScore', String(gameState.highScore));
                celebrateHighScore();
            }
        }

        function resetCurrentScore() {
            gameState.currentScore = 0;
            updateScoreDisplay();
        }

        function loadHighScore() {
            const saved = localStorage.getItem('doorsHighScore');
            if (saved) {
                gameState.highScore = parseInt(saved, 10) || 0;
                hsNumber.textContent = gameState.highScore;
            }
        }

        function restartGame() {
            hideTryAgain();
            gameState.isNegativeResult = false;
            resetCurrentScore();
            drawImage(IMAGES.static);
        }

        // ==================== ANIMATION ====================
        const FRAME_DURATION = 250;
        const LAST_FRAME_NEGATIVE_DURATION = 500;

        function playSequence(images, isNegative, callback) {
            if (gameState.isAnimating) return;

            gameState.isAnimating = true;
            gameState.isNegativeResult = isNegative;

            const startTime = performance.now();
            const frameCount = images.length;
            let soundPlayed = false;
            let lastFrameIndex = -1;

            function animate(currentTime) {
                if (!gameState.isAnimating) return;

                const elapsed = currentTime - startTime;

                // Calculate current frame
                let frameIndex = 0;
                let accTime = 0;

                for (let i = 0; i < frameCount; i++) {
                    const duration = (i === frameCount - 1 && isNegative)
                        ? LAST_FRAME_NEGATIVE_DURATION
                        : FRAME_DURATION;

                    if (elapsed < accTime + duration) {
                        frameIndex = i;
                        break;
                    }
                    accTime += duration;
                    if (i === frameCount - 1) {
                        frameIndex = frameCount; // Animation complete
                    }
                }

                if (frameIndex < frameCount) {
                    // Only redraw if frame changed
                    if (frameIndex !== lastFrameIndex) {
                        lastFrameIndex = frameIndex;
                        const currentImage = images[frameIndex];
                        drawImage(currentImage);

                        // Play sound on last frame
                        if (!soundPlayed && frameIndex === frameCount - 1) {
                            soundPlayed = true;
                            playSound(isNegative ? 'fail' : 'success');
                        }
                    }

                    gameState.animationId = requestAnimationFrame(animate);
                } else {
                    // Animation complete
                    gameState.isAnimating = false;
                    gameState.animationId = null;
                    if (callback) callback();
                }
            }

            gameState.animationId = requestAnimationFrame(animate);
        }

        function handleZoneClick(side) {
            if (gameState.isAnimating) return;

            // Unlock audio and play click sound immediately
            unlockAudio();
            playSound('click');

            hideTryAgain();

            const isPositive = getRandomResult();
            const images = isPositive ? IMAGES[side].positive : IMAGES[side].negative;

            playSequence(images, !isPositive, () => {
                if (gameState.isNegativeResult) {
                    showTryAgain();
                } else {
                    increaseScore();
                    drawImage(IMAGES.static);
                }
            });
        }

        // ==================== EVENT HANDLERS ====================
        function setupEventListeners() {
            const leftZone = document.getElementById('leftZone');
            const rightZone = document.getElementById('rightZone');

            // Use passive: false for touchstart to ensure we can preventDefault
            const touchOptions = { passive: false };

            leftZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleZoneClick('left');
            }, touchOptions);

            rightZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleZoneClick('right');
            }, touchOptions);

            // Mouse fallback for testing
            leftZone.addEventListener('click', () => handleZoneClick('left'));
            rightZone.addEventListener('click', () => handleZoneClick('right'));

            // Try again handlers
            tryAgainOverlay.addEventListener('touchstart', (e) => {
                e.preventDefault();
                restartGame();
            }, touchOptions);

            tryAgainOverlay.addEventListener('click', restartGame);

            // Prevent context menu
            document.addEventListener('contextmenu', e => e.preventDefault());

            // Initial audio unlock on any touch
            document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
        }

        // ==================== UTILITIES ====================
        function debounce(fn, delay) {
            let timeoutId;
            return function(...args) {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        // ==================== TELEGRAM INTEGRATION ====================
        function initTelegram() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                tg.enableClosingConfirmation();

                window.addEventListener('resize', debounce(() => tg.expand(), 100));
            }
        }

        // ==================== INITIALIZATION ====================
        async function initGame() {
            // Cache DOM elements
            tryAgainOverlay = document.getElementById('tryAgainOverlay');
            hsNumber = document.getElementById('hsNumber');
            currentScoreValue = document.getElementById('currentScoreValue');

            initCanvas();
            loadHighScore();
            setupEventListeners();
            initTelegram();

            // Load assets in parallel
            await Promise.all([
                preloadImages(),
                preloadAllSounds()
            ]);

            console.log('Game ready! Images:', imagesLoadedCount, 'Bitmaps:', bitmapCache.size, 'Audio:', audioBuffers.size);

            // Force first draw on next frame for smoother start
            requestAnimationFrame(() => drawImage(IMAGES.static));
        }

        // Start game when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGame);
        } else {
            initGame();
        }
    })();
    </script>
</body>
</html>
